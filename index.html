<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoJo摄影</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 星空背景 -->
  <div class="star-background" id="starBackground"></div>

  <!-- 首页 Hero 区域 -->
  <section class="hero-section" id="hero">
    <div class="hero-content">
      <!-- 头像 -->
      <div class="avatar-container">
        <img id="avatarImg" src="" alt="头像" class="avatar">
        <div class="avatar-glow"></div>
      </div>

      <!-- 标题和社交链接 -->
      <div class="hero-text">
        <h1 class="site-title">JoJo摄影</h1>
        <div class="social-links">
          <a id="link500px" href="#" target="_blank" class="social-btn" title="500px">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.439 9.01A2.994 2.994 0 0 0 4.449 12a2.993 2.993 0 0 0 2.99 2.99 2.994 2.994 0 0 0 2.99-2.99 2.993 2.993 0 0 0-2.99-2.99zm0 4.976A1.987 1.987 0 0 1 5.454 12a1.986 1.986 0 0 1 1.985-1.986A1.986 1.986 0 0 1 9.425 12a1.987 1.987 0 0 1-1.986 1.986zM12 9.01A2.993 2.993 0 0 0 9.01 12 2.993 2.993 0 0 0 12 14.99 2.994 2.994 0 0 0 14.99 12 2.993 2.993 0 0 0 12 9.01zm0 4.976A1.986 1.986 0 0 1 10.014 12c0-1.095.891-1.986 1.986-1.986A1.986 1.986 0 0 1 13.986 12 1.987 1.987 0 0 1 12 13.986zm4.561-4.976A2.993 2.993 0 0 0 13.575 12a2.993 2.993 0 0 0 2.986 2.99 2.994 2.994 0 0 0 2.99-2.99 2.993 2.993 0 0 0-2.99-2.99zm0 4.976A1.987 1.987 0 0 1 14.576 12a1.986 1.986 0 0 1 1.985-1.986A1.986 1.986 0 0 1 18.547 12a1.987 1.987 0 0 1-1.986 1.986z"/></svg>
          </a>
          <a id="linkBilibili" href="#" target="_blank" class="social-btn" title="Bilibili">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.813 4.653h.854c1.51.054 2.769.578 3.773 1.574 1.004.995 1.524 2.249 1.56 3.76v7.36c-.036 1.51-.556 2.769-1.56 3.773s-2.262 1.524-3.773 1.56H5.333c-1.51-.036-2.769-.556-3.773-1.56S.036 18.858 0 17.347v-7.36c.036-1.511.556-2.765 1.56-3.76 1.004-.996 2.262-1.52 3.773-1.574h.774l-1.174-1.12a1.234 1.234 0 0 1-.373-.906c0-.356.124-.658.373-.907l.027-.027c.267-.249.573-.373.92-.373.347 0 .653.124.92.373L9.653 4.44c.071.071.134.142.187.213h4.267a.836.836 0 0 1 .16-.213l2.853-2.747c.267-.249.573-.373.92-.373.347 0 .662.151.929.4.267.249.391.551.391.907 0 .355-.124.657-.373.906zM5.333 7.24c-.746.018-1.373.276-1.88.773-.506.498-.769 1.13-.786 1.894v7.52c.017.764.28 1.395.786 1.893.507.498 1.134.756 1.88.773h13.334c.746-.017 1.373-.275 1.88-.773.506-.498.769-1.129.786-1.893v-7.52c-.017-.765-.28-1.396-.786-1.894-.507-.497-1.134-.755-1.88-.773zM8 11.107c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c0-.373.129-.689.386-.947.258-.257.574-.386.947-.386zm8 0c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c.017-.391.15-.711.4-.96.249-.249.56-.373.933-.373z"/></svg>
          </a>
        </div>
        <p class="tagline">用镜头记录世界的美好</p>
      </div>

      <!-- 泡泡导航 -->
      <div class="bubble-nav" id="bubbleNav"></div>
    </div>

    <!-- 滚动指示器 -->
    <div class="scroll-indicator" id="scrollIndicator">
      <span>向下滚动</span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M19 12l-7 7-7-7"/>
      </svg>
    </div>
  </section>

  <!-- 轮播图区域 -->
  <section class="carousel-section" id="carousel">
    <div class="carousel-container">
      <div class="carousel-track" id="carouselTrack"></div>
      <div class="carousel-indicators" id="carouselIndicators"></div>
    </div>
  </section>

  <!-- 模块网格区域 -->
  <section class="modules-section" id="modules">
    <div class="modules-container">
      <!-- 分类切换 -->
      <div class="category-toggle">
        <button class="toggle-btn active" data-category="type">摄影类型</button>
        <button class="toggle-btn" data-category="device">摄影设备</button>
      </div>
      <!-- 模块网格 -->
      <div class="module-grid" id="moduleGrid"></div>
    </div>
  </section>

  <!-- 图库弹窗 -->
  <div class="gallery-modal" id="galleryModal">
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-header">
        <h2 id="modalTitle">作品展示</h2>
        <p id="modalSubtitle">点击作品查看详情</p>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </div>

  <!-- 图片详情弹窗 -->
  <div class="photo-modal" id="photoModal">
    <div class="photo-overlay" id="photoOverlay"></div>
    <button class="photo-close" id="photoClose">&times;</button>
    <div class="photo-content">
      <img id="photoImage" src="" alt="">
      <div class="photo-info">
        <h3 id="photoTitle"></h3>
        <p id="photoDescription"></p>
        <div class="photo-exif" id="photoExif"></div>
        <div class="photo-tags" id="photoTags"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
