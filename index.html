<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoJo摄影</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="star-background" id="starBackground"></div>

  <!-- 首页 -->
  <section class="hero-section" id="hero">
    <div class="hero-content">
      <div class="bubble-nav" id="bubbleNav"></div>
      
      <div class="avatar-container" id="avatarContainer">
        <img id="avatarImg" src="" alt="头像" class="avatar">
        <div class="avatar-glow"></div>
      </div>

      <div class="hero-text">
        <div class="title-wrapper">
          <h1 class="site-title">JoJo摄影</h1>
          <span class="follow-badge">关注我</span>
        </div>
        <p class="tagline">用镜头记录世界的美好</p>
        <div class="social-icons">
          <button class="social-icon" id="btn500px" title="500px">500px</button>
          <button class="social-icon" id="btnBilibili" title="Bilibili">B站</button>
        </div>
      </div>
    </div>

    <div class="scroll-indicator" id="scrollIndicator">
      <span>向下滚动</span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M19 12l-7 7-7-7"/>
      </svg>
    </div>
  </section>

  <!-- 轮播图 -->
  <section class="carousel-section" id="carousel">
    <div class="carousel-container">
      <div class="carousel-wrapper">
        <div class="carousel-track" id="carouselTrack"></div>
        <div class="carousel-hint">点击查看大图</div>
      </div>
      <div class="carousel-indicators" id="carouselIndicators"></div>
    </div>
  </section>

  <!-- 模块分类 -->
  <section class="modules-section" id="modules">
    <div class="modules-container">
      <div class="category-toggle">
        <button class="toggle-btn active" data-category="type">摄影类型</button>
        <button class="toggle-btn" data-category="device">摄影设备</button>
      </div>
      <div class="module-grid" id="moduleGrid"></div>
    </div>
  </section>

  <!-- 社交链接弹窗 -->
  <div class="social-modal" id="socialModal">
    <div class="modal-overlay" id="socialOverlay"></div>
    <div class="modal-content social-content">
      <button class="modal-close" id="socialClose">&times;</button>
      <h2 class="modal-title">关注我</h2>
      <div class="social-links">
        <a id="socialLink500px" href="#" target="_blank" class="social-link">
          <span>点击进入 500px 主页</span>
        </a>
        <a id="socialLinkBilibili" href="#" target="_blank" class="social-link bilibili">
          <span>点击进入 B站主页</span>
        </a>
      </div>
    </div>
  </div>

  <!-- 轮播图大图弹窗 -->
  <div class="lightbox-modal" id="lightboxModal">
    <div class="lightbox-overlay" id="lightboxOverlay"></div>
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <div class="lightbox-content">
      <div class="lightbox-image-wrapper">
        <img id="lightboxImage" src="" alt="">
      </div>
      <div class="lightbox-info">
        <h3 id="lightboxTitle"></h3>
        <p id="lightboxDescription"></p>
        <div class="lightbox-exif" id="lightboxExif"></div>
      </div>
    </div>
  </div>

  <!-- 图库列表页 -->
  <div class="gallery-page" id="galleryPage">
    <header class="gallery-header">
      <button class="gallery-back" id="galleryBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回</span>
      </button>
      <h1 class="gallery-title" id="galleryTitle">全部作品</h1>
      <span class="gallery-count" id="galleryCount">共 0 张</span>
    </header>
    <div class="gallery-list" id="galleryList"></div>
  </div>

  <!-- 图库大图弹窗 -->
  <div class="photo-modal" id="photoModal">
    <div class="photo-overlay" id="photoOverlay"></div>
    <button class="photo-close" id="photoClose">&times;</button>
    <div class="photo-content">
      <div class="photo-image-wrapper">
        <img id="photoImage" src="" alt="">
      </div>
      <div class="photo-info">
        <h3 id="photoTitle"></h3>
        <p id="photoDescription"></p>
        <div class="photo-exif" id="photoExif"></div>
      </div>
    </div>
  </div>

  <script>
// 配置数据
var config = {};

// 泡泡配置
var BUBBLES = [
  { id: 'macro', label: '微距', mobileSize: 50, desktopSize: 70, color: 'teal' },
  { id: 'blackwhite', label: '黑白', mobileSize: 55, desktopSize: 80, color: 'purple' },
  { id: 'stilllife', label: '静物', mobileSize: 48, desktopSize: 65, color: 'pink' },
  { id: 'animal', label: '动物', mobileSize: 52, desktopSize: 75, color: 'teal' },
  { id: 'landscape', label: '风景', mobileSize: 48, desktopSize: 70, color: 'purple' },
];

var BUBBLE_POSITIONS = {
  mobile: [
    { x: 8, y: 15 },      // 0: 微距
    { x: 78, y: 5 },      // 1: 黑白 - 往上移到顶部
    { x: 5, y: 55 },      // 2: 静物
    { x: 75, y: 50 },     // 3: 动物
    { x: 65, y: 35 },     // 4: 风景 - 往左下移
  ],
  desktop: [
    { x: 10, y: 20 },     // 0: 微距
    { x: 88, y: 5 },      // 1: 黑白 - 往上移到顶部
    { x: 12, y: 65 },     // 2: 静物
    { x: 88, y: 60 },     // 3: 动物
    { x: 78, y: 35 },     // 4: 风景 - 往左下移
  ]
};

// 初始化
function init() {
  fetch('config.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      config = data;
      initStars();
      initHero();
      initCarousel();
      initModules();
      initScroll();
      initSocialModal();
    })
    .catch(function(e) { console.error('加载失败:', e); });
}

// 星空背景
function initStars() {
  var container = document.getElementById('starBackground');
  if (!container) return;
  
  for (var i = 0; i < 50; i++) {
    var star = document.createElement('div');
    star.className = Math.random() > 0.9 ? 'star bright' : 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    container.appendChild(star);
  }
  
  function createMeteor() {
    var meteor = document.createElement('div');
    meteor.className = 'meteor';
    meteor.style.top = (Math.random() * 80) + '%';
    meteor.style.left = (Math.random() * 80) + '%';
    var angle = 25 + Math.random() * 20;
    meteor.style.transform = 'rotate(' + angle + 'deg)';
    container.appendChild(meteor);
    setTimeout(function() {
      if (meteor.parentNode) meteor.parentNode.removeChild(meteor);
    }, 2000);
  }

  createMeteor();
  setTimeout(createMeteor, 1000);
  setInterval(function() {
    if (Math.random() > 0.4) createMeteor();
  }, 2000 + Math.random() * 3000);
}

// Hero区域
function initHero() {
  var avatarImg = document.getElementById('avatarImg');
  if (avatarImg && config.avatar && config.avatar.url) {
    avatarImg.src = config.avatar.url;
  }
  
  // 点击头像或标题打开社交弹窗
  document.getElementById('avatarContainer').onclick = openSocialModal;
  document.querySelector('.title-wrapper').onclick = openSocialModal;
  
  // 社交图标
  document.getElementById('btn500px').onclick = openSocialModal;
  document.getElementById('btnBilibili').onclick = openSocialModal;
  
  initBubbles();
}

// 社交弹窗
function initSocialModal() {
  document.getElementById('socialClose').onclick = closeSocialModal;
  document.getElementById('socialOverlay').onclick = closeSocialModal;
  
  if (config.avatar) {
    document.getElementById('socialLink500px').href = config.avatar.link500px || '#';
    document.getElementById('socialLinkBilibili').href = config.avatar.linkBilibili || '#';
  }
}

function openSocialModal() {
  document.getElementById('socialModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeSocialModal() {
  document.getElementById('socialModal').classList.remove('active');
  document.body.style.overflow = '';
}

// 泡泡导航
function initBubbles() {
  var container = document.getElementById('bubbleNav');
  if (!container) return;
  
  var isMobile = window.innerWidth < 768;
  var positions = isMobile ? BUBBLE_POSITIONS.mobile : BUBBLE_POSITIONS.desktop;
  
  for (var i = 0; i < BUBBLES.length; i++) {
    var bubble = BUBBLES[i];
    var size = isMobile ? bubble.mobileSize : bubble.desktopSize;
    var btn = document.createElement('button');
    btn.className = 'bubble ' + bubble.color;
    btn.textContent = bubble.label;
    btn.style.left = positions[i].x + '%';
    btn.style.top = positions[i].y + '%';
    btn.style.width = size + 'px';
    btn.style.height = size + 'px';
    btn.style.animationDelay = (i * 0.4) + 's';
    (function(id) {
      btn.onclick = function() { openGalleryPage(id); };
    })(bubble.id);
    container.appendChild(btn);
  }
}

// 轮播图
var currentSlide = 0;
var carouselTimer = null;

function initCarousel() {
  var track = document.getElementById('carouselTrack');
  var indicators = document.getElementById('carouselIndicators');
  if (!track || !config.carousel || !config.carousel.images) return;
  
  track.innerHTML = '';
  indicators.innerHTML = '';
  
  var images = config.carousel.images;
  for (var i = 0; i < images.length; i++) {
    var img = images[i];
    var item = document.createElement('div');
    item.className = 'carousel-item';
    (function(image) {
      item.onclick = function() { openLightbox(image); };
    })(img);
    item.innerHTML = '<img src="' + img.url + '" alt="' + img.title + '"><div class="carousel-info"><h3>' + img.title + '</h3><p>' + (img.description || '') + '</p></div>';
    track.appendChild(item);
    
    var dot = document.createElement('button');
    dot.className = 'indicator' + (i === 0 ? ' active' : '');
    dot.onclick = (function(idx) { return function() { goToSlide(idx); }; })(i);
    indicators.appendChild(dot);
  }
  
  updateCarousel();
  startCarousel();
  
  var startX = 0;
  track.addEventListener('touchstart', function(e) {
    startX = e.touches[0].clientX;
    stopCarousel();
  }, { passive: true });
  
  track.addEventListener('touchend', function(e) {
    var endX = e.changedTouches[0].clientX;
    var diff = startX - endX;
    if (Math.abs(diff) > 50) {
      if (diff > 0) nextSlide();
      else prevSlide();
    }
    startCarousel();
  }, { passive: true });
}

function updateCarousel() {
  var track = document.getElementById('carouselTrack');
  var items = track.querySelectorAll('.carousel-item');
  if (items.length === 0) return;
  
  var itemWidth = items[0].offsetWidth + 16;
  track.style.transform = 'translateX(-' + (currentSlide * itemWidth) + 'px)';
  
  var dots = document.querySelectorAll('.indicator');
  for (var i = 0; i < dots.length; i++) {
    dots[i].classList.toggle('active', i === currentSlide);
  }
}

function goToSlide(n) {
  var items = document.querySelectorAll('.carousel-item');
  if (items.length === 0) return;
  currentSlide = n;
  if (currentSlide >= items.length) currentSlide = 0;
  if (currentSlide < 0) currentSlide = items.length - 1;
  updateCarousel();
}

function nextSlide() {
  var items = document.querySelectorAll('.carousel-item');
  if (items.length === 0) return;
  currentSlide++;
  if (currentSlide >= items.length) currentSlide = 0;
  updateCarousel();
}

function prevSlide() {
  var items = document.querySelectorAll('.carousel-item');
  if (items.length === 0) return;
  currentSlide--;
  if (currentSlide < 0) currentSlide = items.length - 1;
  updateCarousel();
}

function startCarousel() {
  if (carouselTimer) clearInterval(carouselTimer);
  var interval = config.carousel && config.carousel.autoPlayInterval ? config.carousel.autoPlayInterval : 5000;
  carouselTimer = setInterval(nextSlide, interval);
}

function stopCarousel() {
  if (carouselTimer) {
    clearInterval(carouselTimer);
    carouselTimer = null;
  }
}

// 轮播图大图弹窗
function openLightbox(image) {
  var modal = document.getElementById('lightboxModal');
  document.getElementById('lightboxImage').src = image.originalUrl || image.url;
  document.getElementById('lightboxTitle').textContent = image.title || '';
  document.getElementById('lightboxDescription').textContent = image.description || '';
  
  var exifDiv = document.getElementById('lightboxExif');
  if (image.exif) {
    var html = '';
    if (image.exif.camera) html += '<div class="exif-item"><span class="exif-icon">📷</span><span>' + image.exif.camera + '</span></div>';
    if (image.exif.lens) html += '<div class="exif-item"><span class="exif-icon">🔍</span><span>' + image.exif.lens + '</span></div>';
    if (image.exif.aperture) html += '<div class="exif-item"><span class="exif-icon">🔘</span><span>' + image.exif.aperture + '</span></div>';
    if (image.exif.shutterSpeed) html += '<div class="exif-item"><span class="exif-icon">⏱️</span><span>' + image.exif.shutterSpeed + '</span></div>';
    if (image.exif.iso) html += '<div class="exif-item"><span class="exif-icon">📊</span><span>ISO ' + image.exif.iso + '</span></div>';
    if (image.exif.focalLength) html += '<div class="exif-item"><span class="exif-icon">📏</span><span>' + image.exif.focalLength + '</span></div>';
    exifDiv.innerHTML = html;
  } else {
    exifDiv.innerHTML = '';
  }
  
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightboxModal').classList.remove('active');
  document.body.style.overflow = '';
}

// 模块
var currentCategory = 'type';

function initModules() {
  var btns = document.querySelectorAll('.toggle-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].onclick = function() {
      for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
      this.classList.add('active');
      currentCategory = this.getAttribute('data-category');
      renderModules();
    };
  }
  renderModules();
}

function renderModules() {
  var grid = document.getElementById('moduleGrid');
  if (!grid || !config.modules) return;
  
  var modules = currentCategory === 'type' ? config.modules.byType : config.modules.byDevice;
  grid.innerHTML = '';
  
  for (var i = 0; i < modules.length; i++) {
    var m = modules[i];
    var card = document.createElement('div');
    card.className = 'module-card';
    (function(id) { card.onclick = function() { openGalleryPage(id); }; })(m.id);
    
    var cover = m.coverUrl ? '<img src="' + m.coverUrl + '">' : '<span>' + m.name[0] + '</span>';
    card.innerHTML = '<div class="module-cover">' + cover + '</div><div class="module-info"><h3>' + m.name + '</h3><p>' + (m.description || '') + '</p></div>';
    grid.appendChild(card);
  }
}

// 图库列表页
var currentTag = null;

function openGalleryPage(tag) {
  currentTag = tag;
  var page = document.getElementById('galleryPage');
  var list = document.getElementById('galleryList');
  var title = document.getElementById('galleryTitle');
  var count = document.getElementById('galleryCount');
  
  // 获取分类名称
  var moduleName = tag;
  var allModules = [];
  if (config.modules && config.modules.byType) allModules = allModules.concat(config.modules.byType);
  if (config.modules && config.modules.byDevice) allModules = allModules.concat(config.modules.byDevice);
  for (var j = 0; j < allModules.length; j++) {
    if (allModules[j].id === tag) { moduleName = allModules[j].name; break; }
  }
  
  // 过滤图片
  var photos = [];
  if (config.gallery && config.gallery.items) {
    for (var i = 0; i < config.gallery.items.length; i++) {
      if (config.gallery.items[i].tags && config.gallery.items[i].tags.indexOf(tag) !== -1) {
        photos.push(config.gallery.items[i]);
      }
    }
  }
  
  title.textContent = moduleName;
  count.textContent = '共 ' + photos.length + ' 张';
  
  // 渲染图片列表
  list.innerHTML = '';
  for (var k = 0; k < photos.length; k++) {
    var item = document.createElement('div');
    item.className = 'gallery-list-item';
    (function(p) { item.onclick = function() { openPhotoModal(p); }; })(photos[k]);
    item.innerHTML = '<img src="' + photos[k].thumbnailUrl + '" alt="' + photos[k].title + '">';
    list.appendChild(item);
  }
  
  page.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeGalleryPage() {
  document.getElementById('galleryPage').classList.remove('active');
  document.body.style.overflow = '';
}

// 图库大图弹窗
function openPhotoModal(photo) {
  var modal = document.getElementById('photoModal');
  document.getElementById('photoImage').src = photo.originalUrl || photo.thumbnailUrl;
  document.getElementById('photoTitle').textContent = photo.title || '';
  document.getElementById('photoDescription').textContent = photo.description || '';
  
  var exifDiv = document.getElementById('photoExif');
  if (photo.exif) {
    var html = '';
    if (photo.exif.camera) html += '<div class="exif-item"><span class="exif-icon">📷</span><span>' + photo.exif.camera + '</span></div>';
    if (photo.exif.lens) html += '<div class="exif-item"><span class="exif-icon">🔍</span><span>' + photo.exif.lens + '</span></div>';
    if (photo.exif.aperture) html += '<div class="exif-item"><span class="exif-icon">🔘</span><span>' + photo.exif.aperture + '</span></div>';
    if (photo.exif.shutterSpeed) html += '<div class="exif-item"><span class="exif-icon">⏱️</span><span>' + photo.exif.shutterSpeed + '</span></div>';
    if (photo.exif.iso) html += '<div class="exif-item"><span class="exif-icon">📊</span><span>ISO ' + photo.exif.iso + '</span></div>';
    if (photo.exif.focalLength) html += '<div class="exif-item"><span class="exif-icon">📏</span><span>' + photo.exif.focalLength + '</span></div>';
    exifDiv.innerHTML = html;
  } else {
    exifDiv.innerHTML = '';
  }
  
  modal.classList.add('active');
}

function closePhotoModal() {
  document.getElementById('photoModal').classList.remove('active');
}

// 滚动指示器
function initScroll() {
  var indicator = document.getElementById('scrollIndicator');
  if (!indicator) return;
  indicator.onclick = function() {
    document.getElementById('carousel').scrollIntoView({ behavior: 'smooth' });
  };
  window.addEventListener('scroll', function() {
    indicator.style.opacity = window.scrollY > 100 ? '0' : '1';
  }, { passive: true });
}

// 事件绑定
document.addEventListener('DOMContentLoaded', function() {
  // 轮播图弹窗
  document.getElementById('lightboxClose').onclick = closeLightbox;
  document.getElementById('lightboxOverlay').onclick = closeLightbox;
  
  // 图库页返回
  document.getElementById('galleryBack').onclick = closeGalleryPage;
  
  // 图库大图弹窗
  document.getElementById('photoClose').onclick = closePhotoModal;
  document.getElementById('photoOverlay').onclick = closePhotoModal;
  
  // ESC键关闭
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closeLightbox();
      closePhotoModal();
      closeSocialModal();
      closeGalleryPage();
    }
  });
  
  init();
});

window.addEventListener('resize', function() {
  var container = document.getElementById('bubbleNav');
  if (container) {
    container.innerHTML = '';
    initBubbles();
  }
  updateCarousel();
});
  </script>
</body>
</html>
